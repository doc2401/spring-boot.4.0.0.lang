# Simple workflow for deploying static content to GitHub Pages
name: Deploy Language‌ content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["lang"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build localized pages
        run: |
          if [ -f config.json ]; then
            jq -c '.pages[]' config.json | while read -r item; do
              url=$(echo "$item" | jq -r '.url')
              clean_url="${url%/}"
              
              echo "Processing URL directory: $clean_url"
              mkdir -p "$clean_url"
              
              # Iterate through the path array
              echo "$item" | jq -r '.path[]' | while read -r src_path; do
                clean_path="${src_path%/}"
                if [ -d "$clean_path" ]; then
                  echo "  -> Copying $clean_path/* to $clean_url/"
                  cp -a "$clean_path"/. "$clean_url"/
                else
                  echo "  -> Warning: Source path $clean_path not found!"
                fi
              done
            done
          else
            echo "config.json not found."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
